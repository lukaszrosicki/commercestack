# compose.yaml
services:
  astro:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /app/node_modules # Izolacja node_modules wewnątrz kontenera (kluczowe na Windows)
    ports:
      - "4321:4321"
    environment:
      - HOST=0.0.0.0 
    # POPRAWKA: Przekazanie flagi host bezpośrednio do binarki astro poprzez npm script CLI arg separator
    command: npm run dev -- --host 0.0.0.0