# .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Jany zestaw uprawnień dla GITHUB_TOKEN wymagany przez zunifikowaną akcję Astro
permissions:
  contents: read
  pages: write
  id-token: write

# Blokada współbieżności zapobiegająca wyścigom (race conditions) przy szybkich commitach
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build Astro Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install, build, and upload your site
        # Oficjalna akcja Astro automatycznie wykrywa package-lock.json, instaluje deps i buduje dist
        uses: withastro/action@v6
        with:
          node-version: 22 # Stabilny LTS rekomendowany dla najnowszego Astro i bibliotek

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # Wykorzystanie najnowszej wersji v5 do wdrożenia wygenerowanego artefaktu
        uses: actions/deploy-pages@v5